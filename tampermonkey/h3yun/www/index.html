
<div class="container fixed-top">
  <div>  
    <div class="query-row" v-if="type=='db'"> 
        <div class="row-item">
           工单编号: <input type="text" name="seqNo" v-model="seqNo" placeholder="工单编号"
          @change="handleChange('wo', {seqNo})">
          <button @click="handleChange('wo', {seqNo})">查询</button>
           当前用户：{{getUserIdFromJwt(getCookie('h3_token'))}}
        </div> 
    </div>
    <div class="query-row" v-if="type==''"> 
      <div class="row-item">
       
      </div>
    </div>
  </div>
</div>
<script  type="module" id="xjs">
// import mqtt from 'mqtt';

  new Vue({
    el: "#xapp",
    data() {
      return {
        text: "",
        approachingExp:false,
        loading: false,
        type:"db",
        client: null,
        message: '',
        seqNo: "", 
        requestPayloads: {
          wo:  '{"schemaCode":"D000024Spsanhwvp64mern284w7xk3m07","scope":4,"sortByCollection":[{"itemName":"CreatedTime","direction":1}],"pageSize":100,"pageIndex":0,"childSchemaCode":"D000024RejectDetailTablePro","listViewDisplayMode":0,"filter":{"matcher":{"type":"And","operator":2,"matchers":[{"type":"Item","name":"SeqNo","value":["{seqNo}"],"operator":8,"matchers":[]}]}}}'

        }
      };
    },
    created() {
    
    },
    beforeDestroy() {
     
    },
    computed: {
     
    },
    
    mounted() { 

    },
    methods: {
        handleChange(key, ...arguments) {
        debugger;
        let map = {};
        arguments.map(item => {
          const keys = Object.keys(item);
          keys.forEach(key => {
            map[key] = item[key].trim();
          })
        });

         const requestPayloads = this.format(this.requestPayloads[key], map);

         fetch('https://www.h3yun.com/v1/bizdata/view/query', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: requestPayloads
        })
        .then(response => response.json())
        .then(data => {
          console.log(data); 
          if(data.returnData?.returnData){
           const objectId =  data.returnData?.returnData[0]?.ObjectId;
           const url = `${window.location.origin}${window.location.pathname}?bizObjectId=${objectId}&schemaCode=D000024Spsanhwvp64mern284w7xk3m07`;
            window.open(url);
          } 
        });

      },
            /**
     * 格式化字符串
     * @param 数值
     * @param 类型
     * map = {a: "aValue", b: "bValue"} format("{a} and {b}", map) ---=》 aValue and bValue
     * @returns {string}
     */
      format(template, map) {
        if (!template) {
          return ''
        }

        if (!map) {
          return template
        }

        for (let mapKey in map) {

          template = template.replaceAll('{' + mapKey + '}', map[mapKey])
        }
        return template;
      },
       getUserIdFromJwt(token) {
          try {
              const parts = token.split('.');
              if (parts.length !== 3) {
                  throw new Error('Invalid JWT format');
              }
              const payload = parts[1];
              // Convert base64url to base64
              const base64 = payload.replace(/-/g, '+').replace(/_/g, '/');
              // Add padding if needed
              const paddedBase64 = base64.padEnd(base64.length + (4 - base64.length % 4) % 4, '=');
              // Decode base64
              const decodedStr = atob(paddedBase64);
              // Handle Unicode characters
              const utf8Str = decodeURIComponent(escape(decodedStr));
              const payloadObj = JSON.parse(utf8Str);
              return payloadObj.userid || null;
          } catch (e) {
              console.error('Failed to parse JWT:', e);
              return null;
          }
      },
      
      getCookie(name) {
        var cookies = document.cookie.split("; ");
        for (var i = 0; i < cookies.length; i++) {
          var cookie = cookies[i].split("=");
          if (cookie[0] === name) {
            return cookie[1];
          }
        }
        return null;
     }

    }
  });
</script>
